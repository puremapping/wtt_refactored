context:
  goal: "wtt 平台接入小程序 —— 让用户通过登录，把画像和行程注入景点讲解/领队类小程序的 LLM，实现个性化讲解"
  next: "见 PLAN.md / DESIGN.md / mvp/README.md。P0-P2 已完成；待阿哲定 D2（选 R1 / R2 / R3）"
  decided: |
    - 双线并行：wtt_ux-refactor 负责交互设计重构；本子项目负责平台接入小程序（阿哲 2026-10-29）
    - 方向和现有链路的关系：现在是把景点数据喂给文旅局智能体；这个是同一类动作（把 context 注入别的 LLM），换了服务对象（第三方小程序/设备）
    - 卡点：平台能控的只有「画像 → 结构化 context」半段；「设备 → 接收」半段由景区/小程序方主导，要谈合作、等接口。这是商业问题，不是技术问题
    - 技术侧不用调研：本质是把 conv.profile + 行程结构化输出成一段 context，接到新出口。想验证一两小时能出 demo
    - 现状数据缺口：profile 字段偏薄（仅动机/时长/同伴/节奏/兴趣/避开），离「个性化讲解」需要粒度有距离
    - 产品理念（阿哲 2026-11-12，见 DESIGN.md §一）：设计权的归属。平台 AI 把设计权留给用户 —— 自由，但要付出精力，且自己未必了解自己的需求；景区导览小程序把设计权交给设计师 —— 不那么自由，但不用思考、只享受美学表达。两端互补，非替代关系
    - 由此的推论：wtt 注入的是「需求理解」不是「行程指令」；注入必须能什么都不注入（画像薄时退回通用讲解）；注入要能被「不想思考」地消费，所以用结构化字段而非散文
    - 合规分工（据参考文档）：备案/类目/算法备案/内容安全/AI 标识 是小程序方主体责任，wtt 不承担，但接口契约要保证对方能履行
    - wtt 做「context 提供方」而非「模型提供方」合规负担小得多：小程序走云开发内置 AI 时算法备案材料由云开发平台自动生成
    - 模拟环境（阿哲 2026-11-13 问「Github 上有没有小程序的模拟环境」）：选 open-wxa/wxa-runner，浏览器跑微信官方基础库 3.7.0，内置基础库、无需装微信开发者工具；本机实测确认未装 DevTools 也能编译渲染 WXML + 发 wx.request。备选见 mvp/README.md §六
    - Windows 踩坑：wxa-runner 的 --host 默认 localhost 绑 IPv6 [::1]，浏览器/curl 走 127.0.0.1 连不上；--host 不带值才监听所有地址
    - P1 MVP 已跑通（2026-11-13，全在 mvp/、主项目代码零改动）：平台侧导出 + 画像→system prompt 组装 + 模拟景区端渲染（P2 已升级为真 R1 账密登录 + 方案一免密）。单测 9/9、e2e 4 场景全过、主项目 275 项零回归
    - MVP 实测教训：稀薄画像判据初版把 primary_intensity 算作独立维度，导致只有动机的画像也注入了；正确判据是「有动机 + 至少一个可操作维度（时长/同伴/节奏/兴趣/避开/必去）」
    - D1 已定（阿哲 2026-11-13）：**不留原话，只导出概括**。profile.summary 留库内，绝不出平台；只出结构化字段 + abstract（由 profile_summary 拼出）。结构性约束，无开关、无 query 参数可打开
    - 分工定位（阿哲 2026-11-13）：现在是模拟景区；以后合作时小程序由景区做、景区备案。mvp/miniprogram/ 是模拟景区端的参考实现，不是交付代码；平台侧要保证的是登录端点 / token 契约 / context 导出契约
    - 补上真 R1 账密登录（初版只做票据壳子且不验密码，是设计失误），复用主项目 auth.verify_password；R1-3 定义已厘清，小程序机制上不携带平台 cookie，初版「跨站 cookie 需实测」作废
    - 方案一免密（阿哲定先做，2026-11-13 已实现）：平台 TTL 30 天 + GET /api/auth/verify 探活（失效返 {valid:false} 非 401）；模拟景区端 utils/session.js 存 token 不存密码、失效静默退回账密；不额外建微信账号体系（wx storage 按 AppID+微信用户由 runtime 隔离，那是 R2 才要的）
    - D2 仍待定：选 R1（当前）/ R2 微信 code 绑定（换设备也免密）/ R3 unionid。平台 users 表无任何微信身份字段、没接 wx.login、没建绑定表、没微信开放平台资质
    - 真实集成仍必做：token 持久化/可撤销/绑真实身份/HTTPS、画像取真实 sessions.profile、景区侧备案与算法备案主体归属。完整 9 项缺口见 mvp/README.md §五
    - 验收（2026-11-13 实跑）：单测 20/20、e2e 5 场景全过（A 完整画像 / B 稀薄退回通用 / C 占位词清洗 / D 错误密码拒绝 / E 免密恢复与退出）、主项目 275 项零回归
    - 重启条件：阿哲决定真去谈景区合作，或需要把 MVP 并回主项目
