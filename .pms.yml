    · 缺的：前端团队空间 UI（开源版无）、API Key 管理接口、审核角色、
      准入质检、bot_id 路由表——全是你要自己补的
    · 成本：12 容器 / 13GB 镜像 / ES+Milvus 吃内存（官方「2核4G」偏乐观）
    · 详见 docs/research/coze-studio-hands-on.md（部署实录+5个坑+接口清单）
      与 coze-studio-multitenant.patch（二开补丁）
  decided: |
    - 【目标】阿哲定为「想尽可能落地试试」，是他第一个与商业化有关的项目
    - 【架构】FastAPI + SQLite + Jinja2 + Leaflet，不做前后端分离（无构建链）
    - 【v0.7】三页式产品 + 身份系统（本次）：
      · 三块：①浏览页 /（瀑布流+三页签：内容/旅游灵感/今日热榜）
              ②AI 对话页 /chat（保留原实现，加「分享行程」）
              ③个人主页 /me（回忆/发布/消息/设置）
      · ⚠️ 保留 /chat 不迁移；/ 换成浏览页（破坏性改动，README 待更新）
      · 独立登录页 /login：不再内嵌弹窗到 chat（阿哲原话「不要把登录入口放在chat」），
        chat/browse 的登录入口全是跳转 + next 回跳
      · 身份 person|agency 注册二选一，**不锁定可升级**（/api/auth/upgrade-agency）
      · agency 注册自动建 teams 行；智能体归属 team 不归属个人
      · /console 开发页：只有 agency 可进（未登录→渲染登录页预选 agency；
        个人→console_denied 提示升级）
      · ⚠️ 发布校验落在服务端：缺 prompt/region 拒绝发布 ——
        region 是主智能体路由的唯一依据，空着发布=路由黑洞
      · 热榜=搜索命中次数（非浏览/点赞，阿哲定）：search_logs + post_search_hits
      · 图片先本地存储（未做上传接口，卡片用占位）；评论要；回忆总结用 LLM；
        浏览页对未登录开放
      · agents.external_id 留空位，将来接 Coze bot 只填这个字段
      · 分享暂存 sessionStorage(pending_share,30min) —— 匿名会话刷新即丢，
        登录回来自动重弹分享框
    - 【v0.5】对话质量修复 + 文档：
      · ⚠️ **兜底不能套模板** —— 模板不读用户输入，必然答非所问
      · 实测：模型打算调工具时 content 为空；服务端把 tool_call 拦掉后，
        reply 与 tool_calls **双空** → 用户收到空洞兜底
      · 修法：**工具被拦后去掉 tools 重问一次，逼模型用文字回答**
      · 占位词清洗：模型会把「未知」当 destination 字面值填进来，
        下游 _is_beijing("未知")→False → 输出「未知还查不了」（荒谬）
      · 修法：_clean_field_value() 把 23 个占位词归一成空，两层清洗
      · ⚠️ events.user_id 改为 **NOT NULL** —— 把「匿名不落库」从
        代码约定升级为**结构约束**（实测写 NULL 被数据库拒绝）
      · 产出 docs/INFORMATION-ARCHITECTURE.md（信息组织 + 标签体系）
    - 【v0.4】用户系统与行为分析：
      · 邮箱+密码登录（pbkdf2_hmac 20 万次，不引 bcrypt）；cookie 用 HMAC 签名
      · ⚠️ **不能强制注册**：匿名可完整使用，只是不落库；生成行程后提示「登录可保存」
      · ⚠️ **匿名会话不落库**（阿哲定）：只在进程内存 + TTL 1h，刷新即丢
      · ⚠️ **不存对话原文**（阿哲定）：message_sent 只记 text_len
      · 会话打 user_id 标签；**所有查询强制 AND user_id=?**（越权实测被拦）
      · 11 种行为事件 append-only，只记登录用户
      · /admin 看板 + ADMIN_TOKEN 门禁（未设置则接口禁用，不裸奔）
    - 【v0.3】对话-行程闭环：
      · AI 通过 function calling 主动生成行程（用户说「生成行程」即触发）
      · AI 能「看见」右侧行程（每轮传行程摘要，能回答「这个人多吗」）
      · 修改需确认：AI 调 propose_modify_itinerary → 前端出确认卡片 → 用户点确认才落实
      · 支持 5 种修改：replace/remove/add/reorder/regenerate
    - 【关键设计】抽取与回复拆两次独立 LLM 调用
      实测：带 assistant 消息的抽取调用会让模型「续写对话」而非抽取
    - 【关键设计】代码层证据校验（小模型会瞎补 companions）
    - 【关键设计】动机七分类配判据词表
    - 【关键设计】⚠️ 服务端校验 tool_calls（白名单）—— prompt 里的「不要调用」不可靠
      且**过滤要按意图分别设计**（一刀切会误杀该调的 propose）
    - 【关键设计】⚠️ 数据边界必须服务端硬拦
      模型会声称「我有上海的数据」并静默给出北京行程（实测），prompt 声明无效
    - 大模型：GLM-4 Flash（可用且最省；glm-4.7 贵 16 倍；5.x 需充值）
    - Embedding：阿里云百炼 text-embedding-v3（1024 维，Workspace 专属端点）
    - 数据源：北京公共数据平台 12 数据集 119,518 行 + 高德地理编码（212 条坐标）
    - 行程编排：自研（聚类+TSP+区收敛+时间预算剪枝），不依赖 LLM 排序
    - 【验证】动机抽取 10 场景 9 正确 0 误判；tool_calls 5 场景全通过；
      用户系统 6 项端到端验证全通过（匿名不落库/隔离/越权/401/403）
  avoid: |
    - 不批量预热 API 配额（高德 POI 搜索仅 100/日）
    - 不把密钥写进代码/文档（已全项目扫描，含推 public 前克隆远程复查）
    - 不在 shell 里传中文 JSON（编码会坏），用 Python httpx
    - 不用 `except: pass` 静默吞异常（会掩盖真问题，已踩过）
    - ⚠️ 改代码后必须：杀旧进程 → 启动 → **验证新接口存在**（曾因端口被孤儿进程占用，
      新服务静默失败，用户看到的还是旧代码）
    - ⚠️ 改前端后要给静态资源加版本号（曾因浏览器缓存旧 JS，功能「没生效」）
    - ⚠️ 数据库迁移：`CREATE TABLE IF NOT EXISTS` 对已存在表跳过 → 新列不生效，
      必须 ALTER TABLE；且**依赖新列的索引要放在迁移之后**（否则 no such column）
    - ⚠️ `fetch` 必须带 `credentials: 'include'`，否则 cookie 不发送，认不出登录用户
    - ⚠️ Starlette 新版 `TemplateResponse(request, name, ctx)`，旧签名会报
      `unhashable type: 'dict'`
    - ⚠️ 别另起新 JS 文件替代旧的（会砍掉已有功能）——要**增量合并**
    - ⚠️ **兜底回复不要套模板** —— 模板不读用户输入，两轮会输出同一句，用户会认为「变傻了」。
      正确做法：让模型重新生成（去掉 tools 再问一次）
    - ⚠️ **LLM 输出要清洗占位词** —— 模型会把「未知/无/不确定」当字面值填进字段，
      污染下游逻辑（曾导致「未知还查不了」）。入口归一成空，且两层都清洗
    - ⚠️ 约束要落在 schema 上，别只靠代码约定（`events.user_id NOT NULL`）
    - ⚠️ 迁移里别用 cols() 快照判重 —— 同批列表里有重复项时会炸
      （踩过：org_id 写重了一次，duplicate column name）
    - ⚠️ 拆 UI 要拆干净：新登录页上线后，chat 里的旧弹窗/函数/绑定必须全删，
      否则两套并存，等于没满足「不要放在 chat」的要求
    - ⚠️ 带匿名会话跳页 = 丢对话 —— 必须先把要保的东西暂存（sessionStorage）再跳
  deps:
