    【调研完成，未立项】Coze Studio 作为文旅平台底座（2026-10-20 实测）：
    · 结论：可作底座。发布不受限（connector 1024=OpenAPI），平台调 /v3/chat 即可，
      **不是我方做成它的插件，而是我方为主、它为引擎**
    · 多租户：表结构支持但产品层锁死，已二开（~120 行 Go + 1 条 ALTER TABLE），
