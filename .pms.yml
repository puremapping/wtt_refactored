deployment:
  repos:
    - role: canonical
      host: local
      path: D:/fs/workspace/projects/where_to_travel
      note: 日常开发位置
    - role: mirror
      host: github
      url: https://github.com/puremapping/where-to-travel
      note: public 镜像，tag v0.1.0 / v0.3.0 / v0.4.0
  services:
    - host: local
      name: where-to-travel
      port: 8100
      note: uvicorn，仅本机；对外需 --host 0.0.0.0
  runtime:
    - host: local
      path: D:/fs/workspace/projects/where_to_travel/data/wtt.db
      note: SQLite 运行数据（212 景区 + 用户/会话/事件），不进 git
    - host: local
      path: D:/fs/workspace/projects/where_to_travel/.env
      note: 凭证（API key + SECRET_KEY + ADMIN_TOKEN），不进 git
